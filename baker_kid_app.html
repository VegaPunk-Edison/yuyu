<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Baker Kid</title>
    <link rel="icon" type="image/png" href="icon-32.png">
    <link rel="apple-touch-icon" href="icon-180.png">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2d5a3d">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Baker Kid">
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f5f1ed;
            min-height: 100vh;
            padding: 10px;
        }
        
        #root {
            max-width: 500px;
            margin: 0 auto;
        }
        
        .container {
            background: white;
            border-radius: 16px;
            padding: 16px;
            box-shadow: 0 10px 40px rgba(45, 90, 61, 0.15);
        }
        
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 3px solid #d4af37;
            padding-bottom: 12px;
        }
        
        .header-content {
            text-align: center;
            flex: 1;
        }
        
        .header h1 {
            font-size: 26px;
            color: #2d5a3d;
            margin-bottom: 4px;
        }
        
        .header p {
            color: #5a5a5a;
            font-size: 12px;
        }
        
        .header-icon {
            background: #3a6b52;
            color: #f5f1ed;
            border: none;
            width: 44px;
            height: 44px;
            border-radius: 12px;
            font-size: 22px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s, transform 0.2s;
        }
        
        .header-icon:hover {
            background: #2d5a3d;
            transform: scale(1.1);
        }
        
        /* MODAL */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            display: flex;
            align-items: flex-end;
            z-index: 1000;
        }
        
        .modal {
            background: #f5f1ed;
            width: 100%;
            max-width: 500px;
            border-radius: 20px 20px 0 0;
            padding: 30px 20px 20px;
            animation: slideUp 0.3s ease;
            max-height: 90vh;
            overflow-y: auto;
            border-top: 3px solid #d4af37;
        }
        
        @keyframes slideUp {
            from {
                transform: translateY(100%);
            }
            to {
                transform: translateY(0);
            }
        }
        
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        
        .modal-title {
            font-size: 20px;
            font-weight: bold;
            color: #2d5a3d;
        }
        
        .modal-close {
            background: none;
            border: none;
            font-size: 28px;
            cursor: pointer;
            color: #5a5a5a;
            padding: 0;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        /* SANDUHR BEREICH */
        .sanduhren-section {
            margin-top: 20px;
            padding-top: 12px;
            border-top: 2px solid #d4af37;
        }
        
        .sanduhren-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-bottom: 15px;
        }
        
        .sanduhr-box {
            text-align: center;
        }
        
        .sanduhr-svg {
            width: 100%;
            height: 140px;
            margin-bottom: 8px;
        }
        
        .sanduhr-count {
            font-size: 20px;
            font-weight: bold;
            color: #2d5a3d;
            margin-top: 6px;
        }
        
        .sanduhr-label {
            font-size: 11px;
            color: #5a5a5a;
            margin-top: 6px;
            font-weight: 500;
        }

        /* REWARDSSTORE */
        .rewardstore-section {
            margin-top: 20px;
            padding-top: 12px;
            border-top: 2px solid #d4af37;
            cursor: pointer;
        }

        .reward-preview-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px;
            background: #f9f7f4;
            border-radius: 8px;
            margin-bottom: 6px;
        }

        .reward-preview-text {
            font-size: 13px;
            color: #2d5a3d;
            font-weight: 500;
        }

        .reward-preview-cost {
            font-size: 13px;
            font-weight: bold;
            color: #d4af37;
        }

        .rewardstore-empty {
            text-align: center;
            font-size: 13px;
            color: #888;
            padding: 10px 0;
        }

        .rewardstore-more {
            text-align: center;
            font-size: 11px;
            color: #3a6b52;
            font-weight: bold;
            margin-top: 4px;
        }

        /* DASHBOARD - Kind-Übersicht */
        .dashboard {
            display: flex;
            flex-direction: row;
            gap: 10px;
            margin-bottom: 20px;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
            padding-bottom: 4px;
        }
        
        .dashboard::-webkit-scrollbar {
            display: none;
        }
        
        .kid-card {
            background: linear-gradient(135deg, #3a6b52 0%, #2d5a3d 100%);
            color: #f5f1ed;
            padding: 12px;
            border-radius: 12px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            text-align: center;
            box-shadow: 0 4px 15px rgba(45, 90, 61, 0.3);
            min-width: 140px;
            flex-shrink: 0;
            scroll-snap-align: start;
        }
        
        .kid-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(45, 90, 61, 0.5);
        }
        
        .kid-avatar {
            margin-bottom: 6px;
            display: flex;
            justify-content: center;
        }

        .kid-avatar img {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid rgba(255,255,255,0.6);
        }
        
        .kid-name {
            font-size: 15px;
            font-weight: bold;
            margin-bottom: 4px;
        }
        
        .kid-bildung {
            font-size: 18px;
            font-weight: bold;
            background: rgba(255,255,255,0.2);
            padding: 5px;
            border-radius: 8px;
            flex: 1;
            min-width: 0;
        }
        
        .kid-bildung-label {
            font-size: 9px;
            margin-top: 2px;
            opacity: 0.9;
        }
        
        /* DETAIL-VIEW */
        .detail-view {
            animation: slideIn 0.3s ease;
        }
        
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .back-button {
            background: #3a6b52;
            color: #f5f1ed;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            margin-bottom: 20px;
            font-size: 14px;
            font-weight: bold;
        }
        
        .back-button:hover {
            background: #2d5a3d;
        }
        
        .detail-header {
            background: linear-gradient(135deg, #3a6b52 0%, #2d5a3d 100%);
            color: #f5f1ed;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            text-align: center;
            border-top: 3px solid #d4af37;
        }
        
        .detail-avatar {
            margin-bottom: 10px;
            display: flex;
            justify-content: center;
        }

        .detail-avatar img {
            width: 88px;
            height: 88px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid rgba(255,255,255,0.7);
        }
        
        .detail-name {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .level-view {
            background: linear-gradient(135deg, #3a6b52 0%, #2d5a3d 100%);
            color: #f5f1ed;
        }

        .level-avatar-img {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid rgba(255,255,255,0.7);
            display: block;
            margin: 0 auto 10px;
        }

        .level-avatar-label {
            font-size: 13px;
            color: rgba(245,241,237,0.8);
            margin-bottom: 16px;
        }

        .herz-leiste {
            display: flex;
            justify-content: center;
            gap: 4px;
            margin-bottom: 14px;
        }

        .herz-svg {
            width: 28px;
            height: 26px;
        }

        .level-gesamt-box {
            background: rgba(255,255,255,0.12);
            border: 2px solid #d4af37;
            border-radius: 12px;
            padding: 14px;
            text-align: center;
            margin-bottom: 20px;
        }

        .level-gesamt-value {
            font-size: 40px;
            font-weight: bold;
            color: #d4af37;
        }

        .level-gesamt-label {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: rgba(245,241,237,0.85);
        }

        .bildung-stats {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
        }
        
        .stat-box {
            background: #f9f7f4;
            padding: 15px;
            border-radius: 12px;
            text-align: center;
            border-left: 4px solid #d4af37;
            flex: 1;
        }
        
        .stat-value {
            font-size: 32px;
            font-weight: bold;
            color: #2d5a3d;
        }
        
        .stat-label {
            font-size: 12px;
            color: #5a5a5a;
            margin-top: 5px;
            text-transform: uppercase;
        }
        
        /* FÄCHER */
        .faecher-section {
            margin-bottom: 20px;
        }
        
        .faecher-title {
            font-size: 16px;
            font-weight: bold;
            color: #2d5a3d;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .fach-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid #e8e4e0;
        }
        
        .fach-row:last-child {
            border-bottom: none;
        }
        
        .fach-name {
            font-size: 14px;
            color: #2d5a3d;
            font-weight: 500;
            flex: 1;
        }
        
        .fach-punkte {
            font-size: 18px;
            font-weight: bold;
            color: #d4af37;
            margin-right: 15px;
            min-width: 40px;
            text-align: right;
        }
        
        .fach-buttons {
            display: flex;
            gap: 8px;
        }
        
        .btn-small {
            background: #3a6b52;
            color: #f5f1ed;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
            transition: background 0.2s;
        }
        
        .btn-small:hover {
            background: #2d5a3d;
        }
        
        .btn-small.minus {
            background: #8b4545;
        }
        
        .btn-small.minus:hover {
            background: #6b3535;
        }

        .btn-small:disabled {
            background: #bbb;
            cursor: not-allowed;
        }

        /* ADD KID FORM */
        .add-kid-section {
            background: #f9f7f4;
            padding: 20px;
            border-radius: 12px;
            margin-top: 20px;
            border-left: 4px solid #d4af37;
        }
        
        .add-kid-title {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 15px;
            color: #2d5a3d;
        }
        
        .form-group {
            margin-bottom: 15px;
        }
        
        .form-group label {
            display: block;
            font-size: 12px;
            color: #2d5a3d;
            margin-bottom: 5px;
            font-weight: bold;
        }
        
        .form-group input {
            width: 100%;
            padding: 10px;
            border: 2px solid #d4af37;
            border-radius: 8px;
            font-size: 14px;
            background: white;
            color: #1a1a1a;
        }
        
        .form-group input:focus {
            outline: none;
            border-color: #3a6b52;
            box-shadow: 0 0 0 3px rgba(58, 107, 82, 0.1);
        }
        
        .avatar-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-bottom: 15px;
        }
        
        .avatar-option {
            padding: 6px;
            border: 2px solid #d4af37;
            border-radius: 8px;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s;
            background: white;
        }

        .avatar-option img {
            width: 100%;
            aspect-ratio: 1;
            border-radius: 6px;
            object-fit: cover;
            display: block;
        }

        .avatar-option:hover {
            border-color: #3a6b52;
        }
        
        .avatar-option.selected {
            border-color: #3a6b52;
            background: #f0f8f5;
        }
        
        .btn-add-kid {
            width: 100%;
            background: #3a6b52;
            color: #f5f1ed;
            border: none;
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: background 0.2s;
        }
        
        .btn-add-kid:hover {
            background: #2d5a3d;
        }
        
        .btn-add-kid:disabled {
            background: #bbb;
            cursor: not-allowed;
        }
        
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #888;
        }
        
        .empty-state p {
            font-size: 16px;
            margin-bottom: 10px;
        }
    </style>
</head>

        const { useState, useEffect, useRef } = React;
        
        const FAECHER = [

            'Sport'

        const PRINZIPIEN = [

            'Ruhige Souveränität',

            'Bett morgens machen'

        // Fest vorhandene Rewards im Rewardstore, immer wieder kaufbar solange genug Guthaben da ist
        const DEFAULT_REWARDS = [

            { id: 'default-heiltrank-gross', text: 'Großer Heilungstrank', cost: 4, healAmount: 8 },

        // Bestehende unkategorisierte Aufgaben landen dabei unter "tugend".
        const migrateAufgabenFormat = (rawAufgaben) => {
            const migriert = {};
            Object.keys(rawAufgaben || {}).forEach(key => {
                const wert = rawAufgaben[key];
                migriert[key] = Array.isArray(wert)
                    ? { bildung: [], tugend: wert, habit: [] }
                    : wert;
            });
            return migriert;

            const [importPreview, setImportPreview] = useState(null);
            const [backupError, setBackupError] = useState('');

            // Haus-Daten
            const [hausZiele, setHausZiele] = useState({});
            const [academiaZiele, setAcademiaZiele] = useState([]);
            const [aufgaben, setAufgaben] = useState({});

            // Add Modal States
            const [showAddZielModal, setShowAddZielModal] = useState(false);
            const [newZielText, setNewZielText] = useState('');
            const [zielType, setZielType] = useState('haus');
            const [newAufgabeKategorie, setNewAufgabeKategorie] = useState('bildung');
            const [newAufgabeKidId, setNewAufgabeKidId] = useState(null);
            const [assigningAufgabeId, setAssigningAufgabeId] = useState(null);

            // Inline-Bearbeitung von Hauszielen/Academia-Zielen/Aufgaben
            const [editingItemId, setEditingItemId] = useState(null);
            const [editingItemText, setEditingItemText] = useState('');

            // Rewardsstore
            const [rewards, setRewards] = useState([]);
            const [showRewardStore, setShowRewardStore] = useState(false);
            const [showAddRewardModal, setShowAddRewardModal] = useState(false);
            const [newRewardText, setNewRewardText] = useState('');
            const [newRewardCost, setNewRewardCost] = useState('');
            const [editingRewardId, setEditingRewardId] = useState(null);
            const [redeemRewardId, setRedeemRewardId] = useState(null);

            // Migrate old 'bildungspunkte_*' localStorage keys to 'bakerkid_*' (one-time, on first load after rename)
            const migrateStorageKey = (oldKey, newKey) => {
                if (localStorage.getItem(newKey) === null) {
                    const oldValue = localStorage.getItem(oldKey);
                    if (oldValue !== null) {
                        localStorage.setItem(newKey, oldValue);
                    }
                }
            };

            // Load from localStorage on mount
            useEffect(() => {
                migrateStorageKey('bildungspunkte_kids', 'bakerkid_kids');
                migrateStorageKey('bildungspunkte_hausziele', 'bakerkid_hausziele');
                migrateStorageKey('bildungspunkte_academia', 'bakerkid_academia');
                migrateStorageKey('bildungspunkte_aufgaben', 'bakerkid_aufgaben');
                migrateStorageKey('bildungspunkte_rewards', 'bakerkid_rewards');

                const saved = localStorage.getItem('bakerkid_kids');
                if (saved) {
                    setKids(JSON.parse(saved));
                }
                const savedHausZiele = localStorage.getItem('bakerkid_hausziele');
                if (savedHausZiele) {
                    setHausZiele(JSON.parse(savedHausZiele));
                }
                const savedAcademiaZiele = localStorage.getItem('bakerkid_academia');
                if (savedAcademiaZiele) {
                    setAcademiaZiele(JSON.parse(savedAcademiaZiele));
                }
                const savedAufgaben = localStorage.getItem('bakerkid_aufgaben');
                if (savedAufgaben) {
                    setAufgaben(migrateAufgabenFormat(JSON.parse(savedAufgaben)));
                }
                const savedRewards = localStorage.getItem('bakerkid_rewards');
                const geladeneRewards = savedRewards ? JSON.parse(savedRewards) : [];
                const fehlendeDefaults = DEFAULT_REWARDS.filter(
                    dr => !geladeneRewards.some(r => r.id === dr.id)
                );
                setRewards([...geladeneRewards, ...fehlendeDefaults]);
            }, []);

            // Save to localStorage whenever kids change
            useEffect(() => {
                localStorage.setItem('bakerkid_kids', JSON.stringify(kids));
            }, [kids]);

            // Save Haus-Ziele
            useEffect(() => {
                localStorage.setItem('bakerkid_hausziele', JSON.stringify(hausZiele));
            }, [hausZiele]);

            // Save Academia-Ziele
            useEffect(() => {
                localStorage.setItem('bakerkid_academia', JSON.stringify(academiaZiele));
            }, [academiaZiele]);

            // Save Aufgaben
            useEffect(() => {
                localStorage.setItem('bakerkid_aufgaben', JSON.stringify(aufgaben));
            }, [aufgaben]);

            // Save Rewards
            useEffect(() => {
                localStorage.setItem('bakerkid_rewards', JSON.stringify(rewards));
            }, [rewards]);
            
            const addKid = () => {
                if (!newKidName.trim() || kids.length >= MAX_KIDS) return;
                
                const newKid = {
                    id: Date.now(),
                    name: newKidName,
                    avatar: selectedAvatar,
                    haus: selectedHaus,
                    punkte: FAECHER.reduce((acc, fach) => ({ ...acc, [fach]: 0 }), {}),
                    prinzipien: PRINZIPIEN.reduce((acc, prinz) => ({ ...acc, [prinz]: 0 }), {}),
                    habits: HABITS.reduce((acc, habit) => ({ ...acc, [habit]: 0 }), {}),
                    eingeloest: 0,
                    herzViertel: 28
                };
                
                setKids([...kids, newKid]);
                setNewKidName('');
                setSelectedAvatar(AVATARS[0]);
                setSelectedHaus(HAEUSER[0]);
                setShowAddKidModal(false);
            };

            // Zieht bei einem echten Punktabzug (Minus-Klick, der den Wert tatsächlich senkt) ein Herzviertel ab
            const applyHerzabzug = (kid, delta) => {
                const herzenVorher = kid.herzViertel ?? 28;
                return delta < 0 ? Math.max(0, herzenVorher - 1) : herzenVorher;
            };

            const updatePunkte = (kidId, fach, delta) => {
                setKids(kids.map(kid => {
                    if (kid.id === kidId) {
                        return {
                            ...kid,
                            punkte: {
                                ...kid.punkte,
                                [fach]: kid.punkte[fach] + delta
                            },
                            herzViertel: applyHerzabzug(kid, delta)
                        };
                    }
                    return kid;
                }));
            };

            const updatePrinzipienPunkte = (kidId, prinzip, delta) => {
                setKids(kids.map(kid => {
                    if (kid.id === kidId) {
                        return {
                            ...kid,
                            prinzipien: {
                                ...kid.prinzipien,
                                [prinzip]: (kid.prinzipien[prinzip] || 0) + delta
                            },
                            herzViertel: applyHerzabzug(kid, delta)
                        };
                    }
                    return kid;
                }));
            };

            const updateHabitsPunkte = (kidId, habit, delta) => {
                setKids(kids.map(kid => {
                    if (kid.id === kidId) {
                        return {
                            ...kid,
                            habits: {
                                ...kid.habits,
                                [habit]: (kid.habits[habit] || 0) + delta
                            },
                            herzViertel: applyHerzabzug(kid, delta)
                        };
                    }
                    return kid;
                }));
            };
            
            const getGesamtpunkte = (kid) => {
                return Object.values(kid.punkte).reduce((a, b) => a + b, 0);
            };
            
            const getYuyuPunkte = (kid) => {
                return Math.floor(getGesamtpunkte(kid) / PUNKTE_PRO_YUYU);
            };

            const getPrinzipienGesamtpunkte = (kid) => {
                return Object.values(kid.prinzipien).reduce((a, b) => a + b, 0);
            };

            const getPrinzipienYuyuPunkte = (kid) => {
                return Math.floor(getPrinzipienGesamtpunkte(kid) / PUNKTE_PRO_YUYU);
            };

            const getHabitsGesamtpunkte = (kid) => {
                return Object.values(kid.habits).reduce((a, b) => a + b, 0);
            };

            const getHabitsYuyuPunkte = (kid) => {
                return Math.floor(getHabitsGesamtpunkte(kid) / PUNKTE_PRO_YUYU);
            };

            const getVerfuegbarePunkte = (kid) => {
                const total = getYuyuPunkte(kid) + getPrinzipienYuyuPunkte(kid) + getHabitsYuyuPunkte(kid);
                return total - (kid.eingeloest || 0);
            };

            const getHerzViertel = (kid) => kid.herzViertel ?? 28;

            const isErschoepft = (kid) => getHerzViertel(kid) <= 12;

            const getLevel = (kid) => {
                return (getYuyuPunkte(kid) + getPrinzipienYuyuPunkte(kid) + getHabitsYuyuPunkte(kid)) * 9;
            };

            const updateKidName = (kidId, newName) => {
                setKids(kids.map(kid => {
                    if (kid.id === kidId) {
                        return { ...kid, name: newName };
                    }
                    return kid;
                }));
                setEditMode(false);
            };
            
            const deleteKid = (kidId) => {
                setKids(kids.filter(k => k.id !== kidId));
                setSelectedKidId(null);
                setShowDeleteConfirm(false);
            };

            // BACKUP EXPORT/IMPORT
            const exportBackup = () => {
                const backup = {
                    version: 1,
                    exportedAt: new Date().toISOString(),
                    kids,
                    hausZiele,
                    academiaZiele,
                    aufgaben,
                    rewards
                };
                const blob = new Blob([JSON.stringify(backup, null, 2)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = url;
                link.download = `baker-kid-backup-${new Date().toISOString().slice(0, 10)}.json`;
                link.click();
                URL.revokeObjectURL(url);
            };

            const handleImportFile = (event) => {
                const file = event.target.files[0];
                event.target.value = '';
                if (!file) return;

                const reader = new FileReader();
                reader.onload = () => {
                    try {
                        const parsed = JSON.parse(reader.result);
                        if (!Array.isArray(parsed.kids)) {
                            throw new Error('Ungültiges Backup-Format');
                        }
                        setBackupError('');
                        setImportPreview(parsed);
                    } catch (e) {
                        setBackupError('Diese Datei ist kein gültiges Baker-Kid-Backup.');
                        setImportPreview(null);
                    }
                };
                reader.readAsText(file);
            };

            const confirmImport = () => {
                if (!importPreview) return;
                setKids(importPreview.kids || []);
                setHausZiele(importPreview.hausZiele || {});
                setAcademiaZiele(importPreview.academiaZiele || []);
                setAufgaben(migrateAufgabenFormat(importPreview.aufgaben || {}));
                setRewards(importPreview.rewards || []);
                setImportPreview(null);
                setBackupError('');
                setShowBackupModal(false);
            };

            // HAUS-ZIELE
            const addZiel = () => {
                if (!newZielText.trim()) return;
                
                if (zielType === 'haus' && selectedHausName) {
                    const key = `haus_${selectedHausName}`;
                    setHausZiele({
                        ...hausZiele,
                        [key]: [...(hausZiele[key] || []), { id: Date.now(), text: newZielText }]
                    });
                } else if (zielType === 'academia') {
                    setAcademiaZiele([
                        ...academiaZiele,
                        { id: Date.now(), text: newZielText }
                    ]);
                }
                
                setNewZielText('');
                setZielType('haus');
                setShowAddZielModal(false);
            };
            
            const deleteZiel = (zielId) => {
                if (selectedHausName) {
                    const key = `haus_${selectedHausName}`;
                    setHausZiele({
                        ...hausZiele,
                        [key]: (hausZiele[key] || []).filter(z => z.id !== zielId)
                    });
                }
            };

            const updateZiel = (zielId, newText) => {
                if (selectedHausName) {
                    const key = `haus_${selectedHausName}`;
                    setHausZiele({
                        ...hausZiele,
                        [key]: (hausZiele[key] || []).map(z => z.id === zielId ? { ...z, text: newText } : z)
                    });
                }
                setEditingItemId(null);
            };

            const deleteAcademiaZiel = (zielId) => {
                setAcademiaZiele(academiaZiele.filter(z => z.id !== zielId));
            };

            const updateAcademiaZiel = (zielId, newText) => {
                setAcademiaZiele(academiaZiele.map(z => z.id === zielId ? { ...z, text: newText } : z));
                setEditingItemId(null);
            };

            // AUFGABEN
            const leereAufgabenKategorien = { bildung: [], tugend: [], habit: [] };

            const addAufgabe = (kategorie, kidId) => {
                if (!newZielText.trim() || !selectedHausName) return;

                const key = `aufgaben_${selectedHausName}`;
                const bisherige = aufgaben[key] || leereAufgabenKategorien;
                setAufgaben({
                    ...aufgaben,
                    [key]: {
                        ...bisherige,
                        [kategorie]: [...(bisherige[kategorie] || []), { id: Date.now(), text: newZielText, kidId: kidId || null }]
                    }
                });
                setNewZielText('');
                setNewAufgabeKidId(null);
                setShowAddZielModal(false);
            };

            const assignAufgabeToKid = (aufgabeId, kategorie, kidId) => {
                if (!selectedHausName) return;
                const key = `aufgaben_${selectedHausName}`;
                const bisherige = aufgaben[key] || leereAufgabenKategorien;
                setAufgaben({
                    ...aufgaben,
                    [key]: {
                        ...bisherige,
                        [kategorie]: (bisherige[kategorie] || []).map(a =>
                            a.id === aufgabeId ? { ...a, kidId: kidId || null } : a
                        )
                    }
                });
                setAssigningAufgabeId(null);
            };

            const deleteAufgabe = (aufgabeId, kategorie) => {
                if (selectedHausName) {
                    const key = `aufgaben_${selectedHausName}`;
                    const bisherige = aufgaben[key] || leereAufgabenKategorien;
                    setAufgaben({
                        ...aufgaben,
                        [key]: {
                            ...bisherige,
                            [kategorie]: (bisherige[kategorie] || []).filter(a => a.id !== aufgabeId)
                        }
                    });
                }
            };

            const updateAufgabe = (aufgabeId, kategorie, newText) => {
                if (selectedHausName) {
                    const key = `aufgaben_${selectedHausName}`;
                    const bisherige = aufgaben[key] || leereAufgabenKategorien;
                    setAufgaben({
                        ...aufgaben,
                        [key]: {
                            ...bisherige,
                            [kategorie]: (bisherige[kategorie] || []).map(a => a.id === aufgabeId ? { ...a, text: newText } : a)
                        }
                    });
                }
                setEditingItemId(null);
            };

            // REWARDSSTORE
            const saveReward = () => {
                const cost = Number(newRewardCost);
                if (!newRewardText.trim() || !cost || cost <= 0) return;

                if (editingRewardId !== null) {
                    setRewards(rewards.map(r =>
                        r.id === editingRewardId ? { ...r, text: newRewardText, cost } : r
                    ));
                } else {
                    setRewards([...rewards, { id: Date.now(), text: newRewardText, cost }]);
                }
                setNewRewardText('');
                setNewRewardCost('');
                setEditingRewardId(null);
                setShowAddRewardModal(false);
            };

            const startEditReward = (reward) => {
                setEditingRewardId(reward.id);
                setNewRewardText(reward.text);
                setNewRewardCost(String(reward.cost));
                setShowAddRewardModal(true);
            };

            const closeRewardModal = () => {
                setShowAddRewardModal(false);
                setEditingRewardId(null);
                setNewRewardText('');
                setNewRewardCost('');
            };

            const deleteReward = (rewardId) => {
                setRewards(rewards.filter(r => r.id !== rewardId));
                setRedeemRewardId(null);
            };

            // Reward per Gedrückt-Halten verschieben (Long-Press-Drag)
            const [draggingRewardId, setDraggingRewardId] = useState(null);
            const rewardDragRef = useRef({ timer: null });

            const handleRewardHandlePointerDown = (e, reward) => {
                const startX = e.clientX;
                const startY = e.clientY;
                const cancelIfMoved = (moveEvent) => {
                    if (Math.abs(moveEvent.clientX - startX) > 8 || Math.abs(moveEvent.clientY - startY) > 8) {
                        clearTimeout(rewardDragRef.current.timer);
                        window.removeEventListener('pointermove', cancelIfMoved);
                    }
                };
                const clearOnUp = () => {
                    clearTimeout(rewardDragRef.current.timer);
                    window.removeEventListener('pointermove', cancelIfMoved);
                    window.removeEventListener('pointerup', clearOnUp);
                };
                window.addEventListener('pointermove', cancelIfMoved);
                window.addEventListener('pointerup', clearOnUp, { once: true });
                rewardDragRef.current.timer = setTimeout(() => {
                    window.removeEventListener('pointermove', cancelIfMoved);
                    window.removeEventListener('pointerup', clearOnUp);
                    setDraggingRewardId(String(reward.id));
                }, 350);
            };

            useEffect(() => {
                if (draggingRewardId === null) return;

                const handleMove = (e) => {
                    const el = document.elementFromPoint(e.clientX, e.clientY);
                    const rowEl = el && el.closest('[data-reward-id]');
                    if (!rowEl) return;
                    const overId = rowEl.getAttribute('data-reward-id');
                    if (overId === draggingRewardId) return;
                    setRewards(prev => {
                        const fromIndex = prev.findIndex(r => String(r.id) === draggingRewardId);
                        const toIndex = prev.findIndex(r => String(r.id) === overId);
                        if (fromIndex === -1 || toIndex === -1) return prev;
                        const updated = [...prev];
                        const [moved] = updated.splice(fromIndex, 1);
                        updated.splice(toIndex, 0, moved);
                        return updated;
                    });
                };

                const handleUp = () => setDraggingRewardId(null);

                window.addEventListener('pointermove', handleMove);
                window.addEventListener('pointerup', handleUp);
                return () => {
                    window.removeEventListener('pointermove', handleMove);
                    window.removeEventListener('pointerup', handleUp);
                };
            }, [draggingRewardId]);

            const redeemReward = (kidId, reward) => {
                setKids(kids.map(kid => {
                    if (kid.id === kidId) {
                        const herzViertel = reward.healAmount
                            ? Math.min(28, (kid.herzViertel ?? 28) + reward.healAmount)
                            : (kid.herzViertel ?? 28);
                        return { ...kid, eingeloest: (kid.eingeloest || 0) + reward.cost, herzViertel };
                    }
                    return kid;
                }));
                setRedeemRewardId(null);
            };

            // GEMEINSCHAFTSRAUM VIEW
            if (selectedHausName !== null) {
                const haus = HAEUSER.find(h => h.name === selectedHausName);
                const hausZieListKey = `haus_${selectedHausName}`;
                const aufgabenKey = `aufgaben_${selectedHausName}`;
                
                return (
                    <div className="container detail-view">
                        <button className="back-button" onClick={() => setSelectedHausName(null)}>
                            ← Zurück
                        </button>
                        
                        <div className="detail-header">
                            <img src={haus.icon} alt={haus.name} style={{ width: '170px', height: '170px' }} />
                        </div>
                        
                        {/* ACADEMIA ZIELE */}
                        <div style={{ marginBottom: '25px' }}>
                            <div className="faecher-title">📖 Academia Ziele</div>
                            {academiaZiele.map(ziel => (
                                <div key={ziel.id} className="fach-row">
                                    {editingItemId === ziel.id ? (
                                        <>
                                            <input
                                                type="text"
                                                value={editingItemText}
                                                onChange={(e) => setEditingItemText(e.target.value)}
                                                onKeyPress={(e) => e.key === 'Enter' && updateAcademiaZiel(ziel.id, editingItemText)}
                                                autoFocus
                                                style={{ flex: 1, padding: '6px 10px', border: '2px solid #d4af37', borderRadius: '6px', fontSize: '14px', marginRight: '8px' }}
                                            />
                                            <div className="fach-buttons">
                                                <button className="btn-small" onClick={() => updateAcademiaZiel(ziel.id, editingItemText)} style={{ background: '#d4af37', color: '#2d5a3d' }}>✓</button>
                                                <button className="btn-small minus" onClick={() => setEditingItemId(null)}>✕</button>
                                            </div>
                                        </>
                                    ) : (
                                        <>
                                            <div className="fach-name">{ziel.text}</div>
                                            <div className="fach-buttons">
                                                <button className="btn-small" onClick={() => { setEditingItemId(ziel.id); setEditingItemText(ziel.text); }} style={{ background: '#d4af37', color: '#2d5a3d' }}>✎</button>
                                                <button className="btn-small minus" onClick={() => deleteAcademiaZiel(ziel.id)}>✕</button>
                                            </div>
                                        </>
                                    )}
                                </div>
                            ))}
                            <button
                                className="btn-small"
                                onClick={() => { setZielType('academia'); setShowAddZielModal(true); }}
                                style={{ marginTop: '10px', width: '100%' }}
                            >
                                + Academia Ziel hinzufügen
                            </button>
                        </div>

                        {/* HAUSZIELE */}
                        <div style={{ marginBottom: '25px' }}>
                            <div className="faecher-title">🎯 Hausziele</div>
                            {(hausZiele[hausZieListKey] || []).map(ziel => (
                                <div key={ziel.id} className="fach-row">
                                    {editingItemId === ziel.id ? (
                                        <>
                                            <input
                                                type="text"
                                                value={editingItemText}
                                                onChange={(e) => setEditingItemText(e.target.value)}
                                                onKeyPress={(e) => e.key === 'Enter' && updateZiel(ziel.id, editingItemText)}
                                                autoFocus
                                                style={{ flex: 1, padding: '6px 10px', border: '2px solid #d4af37', borderRadius: '6px', fontSize: '14px', marginRight: '8px' }}
                                            />
                                            <div className="fach-buttons">
                                                <button className="btn-small" onClick={() => updateZiel(ziel.id, editingItemText)} style={{ background: '#d4af37', color: '#2d5a3d' }}>✓</button>
                                                <button className="btn-small minus" onClick={() => setEditingItemId(null)}>✕</button>
                                            </div>
                                        </>
                                    ) : (
                                        <>
                                            <div className="fach-name">{ziel.text}</div>
                                            <div className="fach-buttons">
                                                <button className="btn-small" onClick={() => { setEditingItemId(ziel.id); setEditingItemText(ziel.text); }} style={{ background: '#d4af37', color: '#2d5a3d' }}>✎</button>
                                                <button className="btn-small minus" onClick={() => deleteZiel(ziel.id)}>✕</button>
                                            </div>
                                        </>
                                    )}
                                </div>
                            ))}
                            <button
                                className="btn-small"
                                onClick={() => { setZielType('haus'); setShowAddZielModal(true); }}
                                style={{ marginTop: '10px', width: '100%' }}
                            >
                                + Hausziel hinzufügen
                            </button>
                        </div>

                        {/* BLACKBOARD - AUFGABEN */}
                        <div style={{ marginBottom: '25px' }}>
                            <div className="faecher-title">📋 Blackboard - Aufgaben</div>
                            {[
                                { key: 'bildung', icon: '📚', label: 'Bildung' },
                                { key: 'tugend', icon: '💎', label: 'Tugend' },
                                { key: 'habit', icon: '🔄', label: 'Habit' },
                            ].map(kat => (
                                <div key={kat.key} style={{ marginBottom: '18px' }}>
                                    <div style={{ fontSize: '13px', fontWeight: 'bold', color: '#2d5a3d', marginBottom: '8px' }}>
                                        {kat.icon} {kat.label}
                                    </div>
                                    {((aufgaben[aufgabenKey] || leereAufgabenKategorien)[kat.key] || []).map(aufgabe => {
                                        const zugeordnetesKind = kids.find(k => k.id === aufgabe.kidId);
                                        const isAssigning = assigningAufgabeId === aufgabe.id;
                                        const hausKids = kids.filter(k => k.haus.name === selectedHausName);
                                        return (
                                            <div key={aufgabe.id} style={{ marginBottom: '8px' }}>
                                                <div
                                                    className="fach-row"
                                                    style={{
                                                        background: zugeordnetesKind ? 'rgba(212,175,55,0.12)' : '#f9f7f4',

                                <div className="stat-label">Tugend</div>
                            </div>
                            <div className="stat-box">
                                <div className="stat-value">{getHabitsYuyuPunkte(selectedKid)}</div>
                                <div className="stat-label">Habit</div>
                            </div>
                        </div>

                        {/* TABS */}
                        <div style={{ display: 'flex', gap: '0', marginBottom: '20px', borderBottom: '2px solid #d4af37' }}>
                            <button
                                onClick={() => setSelectedTab('bildung')}
                                style={{
                                    flex: 1,
                                    padding: '12px',
                                    border: 'none',
                                    background: selectedTab === 'bildung' ? '#3a6b52' : '#f9f7f4',
                                    color: selectedTab === 'bildung' ? '#f5f1ed' : '#2d5a3d',
                                    cursor: 'pointer',
                                    fontWeight: 'bold',
                                    fontSize: '13px',
                                    borderBottom: selectedTab === 'bildung' ? '3px solid #d4af37' : 'none',
                                    transition: 'all 0.2s'
                                }}
                            >
                                📚 Bildung
                            </button>
                            <button
                                onClick={() => setSelectedTab('prinzipien')}
                                style={{
                                    flex: 1,
                                    padding: '12px',
                                    border: 'none',
                                    background: selectedTab === 'prinzipien' ? '#3a6b52' : '#f9f7f4',
                                    color: selectedTab === 'prinzipien' ? '#f5f1ed' : '#2d5a3d',
                                    cursor: 'pointer',
                                    fontWeight: 'bold',
                                    fontSize: '13px',
                                    borderBottom: selectedTab === 'prinzipien' ? '3px solid #d4af37' : 'none',
                                    transition: 'all 0.2s'
                                }}
                            >
                                💎 Tugend
                            </button>
                            <button
                                onClick={() => setSelectedTab('habits')}
                                style={{
                                    flex: 1,
                                    padding: '12px',
                                    border: 'none',
                                    background: selectedTab === 'habits' ? '#3a6b52' : '#f9f7f4',
                                    color: selectedTab === 'habits' ? '#f5f1ed' : '#2d5a3d',
                                    cursor: 'pointer',
                                    fontWeight: 'bold',
                                    fontSize: '13px',
                                    borderBottom: selectedTab === 'habits' ? '3px solid #d4af37' : 'none',
                                    transition: 'all 0.2s'
                                }}
                            >
                                🔄 Habit
                            </button>
                        </div>
                        
                        {/* BILDUNG TAB */}
                        {selectedTab === 'bildung' && (
                            <>
                                <div className="faecher-section">
                                    <div className="faecher-title">Fächer</div>
                                    {FAECHER.map(fach => (
                                        <div key={fach} className="fach-row">
                                            <div className="fach-name">{fach}</div>
                                            <div className="fach-punkte">{selectedKid.punkte[fach]}</div>
                                            <div className="fach-buttons">
                                                <button 
                                                    className="btn-small minus"
                                                    onClick={() => updatePunkte(selectedKidId, fach, -1)}
                                                >
                                                    −
                                                </button>
                                                <button 
                                                    className="btn-small"
                                                    onClick={() => updatePunkte(selectedKidId, fach, 1)}
                                                >
                                                    +
                                                </button>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </>
                        )}
                        
                        {/* PRINZIPIEN TAB */}
                        {selectedTab === 'prinzipien' && (
                            <>
                                <div className="faecher-section">
                                    <div className="faecher-title">Werte & Tugend</div>
                                    {PRINZIPIEN.map(prinzip => (
                                        <div key={prinzip} className="fach-row">
                                            <div className="fach-name">{prinzip}</div>
                                            <div className="fach-punkte">{selectedKid.prinzipien[prinzip] || 0}</div>
                                            <div className="fach-buttons">
                                                <button 
                                                    className="btn-small minus"
                                                    onClick={() => updatePrinzipienPunkte(selectedKidId, prinzip, -1)}
                                                >
                                                    −
                                                </button>
                                                <button 
                                                    className="btn-small"
                                                    onClick={() => updatePrinzipienPunkte(selectedKidId, prinzip, 1)}
                                                >
                                                    +
                                                </button>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </>
                        )}
                        
                        {/* HABITS TAB */}
                        {selectedTab === 'habits' && (
                            <>
                                <div className="faecher-section">
                                    {HABITS.map(habit => (
                                        <div key={habit} className="fach-row">
                                            <div className="fach-name">{habit}</div>
                                            <div className="fach-punkte">{selectedKid.habits[habit] || 0}</div>
                                            <div className="fach-buttons">
                                                <button 
                                                    className="btn-small minus"
                                                    onClick={() => updateHabitsPunkte(selectedKidId, habit, -1)}
                                                >
                                                    −
                                                </button>
                                                <button 
                                                    className="btn-small"
                                                    onClick={() => updateHabitsPunkte(selectedKidId, habit, 1)}
                                                >
                                                    +
                                                </button>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </>
                        )}
                    </div>
                );
            }
            
            // DASHBOARD VIEW
            return (
                <div className="container">
                    <div className="header">
                        <div className="header-content">
                            <h1>
                                <img src={DETECTIVE_ICON} alt="" width="28" height="28" style={{ verticalAlign: 'middle', marginRight: '6px', borderRadius: '6px' }} />
                                Baker Kid
                            </h1>
                            <p>Old Money Erziehung Tracker</p>
                        </div>
                        <div style={{ display: 'flex', gap: '8px' }}>
                            <button
                                className="header-icon"
                                onClick={() => setShowBackupModal(true)}
                                title="Backup exportieren/importieren"
                            >
                                💾
                            </button>
                            {kids.length < MAX_KIDS && (
                                <button
                                    className="header-icon"
                                    onClick={() => setShowAddKidModal(true)}
                                    title="Kind hinzufügen"
                                >
                                    ➕
                                </button>
                            )}
                        </div>
                    </div>
                    
                    {kids.length === 0 ? (
                        <div className="empty-state">
                            <p>Noch keine Kinder hinzugefügt.</p>
                            <p>Drücke das ➕ Icon oben rechts um zu beginnen.</p>
                        </div>
                    ) : (
                        <>
                            <div className="dashboard">
                                {kids.map(kid => (
                                    <div 
                                        key={kid.id}
                                        className="kid-card"
                                        onClick={() => setSelectedKidId(kid.id)}
                                        style={{ borderTop: `4px solid ${getHaus(kid.haus).color}` }}
                                    >
                                        <div className="kid-avatar">
                                            <img src={kid.avatar.src} alt={kid.avatar.label} />
                                        </div>
                                        <div className="kid-name">{kid.name}</div>
                                        <div style={{ display: 'flex', justifyContent: 'center' }}>
                                            <img src={getHaus(kid.haus).icon} alt={kid.haus.name} style={{ width: '34px', height: '34px' }} />
                                        </div>
                                        <div style={{ fontSize: '12px', fontWeight: 'bold', color: '#d4af37', marginBottom: '8px' }}>
                                            {getVerfuegbarePunkte(kid)} Mauzbits
                                        </div>
                                        <div style={{ display: 'flex', gap: '6px', justifyContent: 'center' }}>
                                            <div className="kid-bildung" style={{ flex: 1 }}>
                                                {getYuyuPunkte(kid)}
                                                <div className="kid-bildung-label">Bildung</div>
                                            </div>
                                            <div className="kid-bildung" style={{ flex: 1, background: 'rgba(255,255,255,0.3)' }}>
                                                {getPrinzipienYuyuPunkte(kid)}
                                                <div className="kid-bildung-label">Tugend</div>
                                            </div>
                                            <div className="kid-bildung" style={{ flex: 1, background: 'rgba(255,255,255,0.2)' }}>
                                                {getHabitsYuyuPunkte(kid)}
                                                <div className="kid-bildung-label">Habit</div>
                                            </div>
                                        </div>
                                    </div>
                                ))}
                            </div>
                            
                            {/* SANDUHREN */}
                            <div className="sanduhren-section">
                                <div style={{ fontSize: '12px', fontWeight: 'bold', marginBottom: '10px', color: '#2d5a3d', textAlign: 'center' }}>
                                    Fortschritt der Häuser
                                </div>
                                <div className="sanduhren-container">
                                    {HAEUSER.map(haus => {
                                        const hausKids = kids.filter(k => k.haus.name === haus.name);
                                        const totalBildung = hausKids.reduce((sum, kid) =>
                                            sum + getYuyuPunkte(kid) + getPrinzipienYuyuPunkte(kid) + getHabitsYuyuPunkte(kid), 0
                                        );
                                        const sanduhrFraction = Math.max(0, Math.min(1, totalBildung / SANDUHR_MAX));
                                        const sanduhrVoll = totalBildung >= SANDUHR_MAX;

                                        return (
                                            <div
                                                key={haus.name}
                                                className="sanduhr-box"
                                                onClick={() => setSelectedHausName(haus.name)}
                                                style={{ cursor: 'pointer' }}
                                            >
                                            <svg className="sanduhr-svg" viewBox="0 0 100 160">
                                                    <defs>
                                                        <clipPath id={`sanduhr-clip-top-${haus.name}`}>
                                                            <path d="M 20,10 L 80,10 L 50,80 Z" />
                                                        </clipPath>
                                                        <clipPath id={`sanduhr-clip-bottom-${haus.name}`}>
                                                            <path d="M 50,80 L 80,150 L 20,150 Z" />
                                                        </clipPath>
                                                    </defs>

                                                    {/* Oberes Glas: erst voll eingefärbt, wenn 100% erreicht sind */}
                                                    {sanduhrVoll && (
                                                        <rect
                                                            x="20"
                                                            y="10"
                                                            width="60"
                                                            height="70"
                                                            fill={haus.color}
                                                            opacity="0.2"
                                                            clipPath={`url(#sanduhr-clip-top-${haus.name})`}
                                                        />
                                                    )}

                                                    {/* Unteres Glas: Füllstand proportional zum Fortschritt */}
                                                    <rect
                                                        x="20"
                                                        y={150 - sanduhrFraction * 70}
                                                        width="60"
                                                        height={sanduhrFraction * 70}
                                                        fill={haus.color}
                                                        opacity="0.2"
                                                        clipPath={`url(#sanduhr-clip-bottom-${haus.name})`}
                                                    />

                                                    {/* Minimalistische Umrisslinie */}
                                                    <path
                                                        d="M 20,10 L 80,10 L 50,80 L 80,150 L 20,150 L 50,80 Z"
                                                        fill="none"
                                                        stroke={haus.color}
                                                        strokeWidth="2"
                                                        strokeLinejoin="round"
                                                        strokeLinecap="round"
                                                    />
                                                </svg>
                                                <div className="sanduhr-count">{totalBildung}</div>
                                                <div style={{ display: 'flex', justifyContent: 'center', marginTop: '6px' }}>
                                                    <img src={haus.icon} alt={haus.name} style={{ width: '40px', height: '40px' }} />
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>
                        </>
                    )}

                    {/* REWARDSSTORE PREVIEW */}
                    <div className="rewardstore-section" onClick={() => setShowRewardStore(true)}>
                        <div style={{ fontSize: '12px', fontWeight: 'bold', marginBottom: '10px', color: '#2d5a3d', textAlign: 'center' }}>
                            🎁 Rewardsstore
                        </div>
                        {rewards.length === 0 ? (
                            <div className="rewardstore-empty">Noch keine Rewards – antippen zum Hinzufügen</div>
                        ) : (
                            rewards.slice(0, 3).map(reward => (
                                <div key={reward.id} className="reward-preview-row">
                                    <span className="reward-preview-text">{reward.text}</span>
                                    <span className="reward-preview-cost">{reward.cost} P</span>
                                </div>
                            ))
                        )}
                        <div className="rewardstore-more">Alle Rewards ansehen →</div>
                    </div>

                    {showAddKidModal && (
                        <div className="modal-overlay" onClick={() => setShowAddKidModal(false)}>
                            <div className="modal" onClick={(e) => e.stopPropagation()}>
                                <div className="modal-header">
                                    <div className="modal-title">➕ Kind hinzufügen</div>
                                    <button 
                                        className="modal-close"
                                        onClick={() => setShowAddKidModal(false)}
                                    >
                                        ✕
                                    </button>
                                </div>
                                
                                <div className="form-group">
                                    <label>Name des Kindes</label>
                                    <input 
                                        type="text"
                                        placeholder="z.B. Maximilian"
                                        value={newKidName}
                                        onChange={(e) => setNewKidName(e.target.value)}
                                        onKeyPress={(e) => e.key === 'Enter' && addKid()}
                                        autoFocus
                                    />
                                </div>
                                
                                <div className="form-group">
                                    <label>Avatar wählen</label>
                                    <div className="avatar-grid">
                                        {AVATARS.map(avatar => (
                                            <div
                                                key={avatar.id}
                                                className={`avatar-option ${selectedAvatar.id === avatar.id ? 'selected' : ''}`}
                                                onClick={() => setSelectedAvatar(avatar)}
                                            >
                                                <img src={avatar.src} alt={avatar.label} />
                                            </div>
                                        ))}
                                    </div>
                                </div>
                                
                                <div className="form-group">
                                    <label>Haus wählen</label>
                                    <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '10px' }}>
                                        {HAEUSER.map(haus => (
                                            <div 
                                                key={haus.name}
                                                onClick={() => setSelectedHaus(haus)}
                                                style={{
                                                    padding: '15px',
                                                    border: '2px solid ' + (selectedHaus.name === haus.name ? haus.color : '#ddd'),
                                                    borderRadius: '8px',
                                                    cursor: 'pointer',
                                                    textAlign: 'center',
                                                    background: selectedHaus.name === haus.name ? haus.color + '20' : 'white',
                                                    transition: 'all 0.2s'
                                                }}
                                            >
                                                <img src={haus.icon} alt={haus.name} style={{ width: '64px', height: '64px' }} />
                                            </div>
                                        ))}
                                    </div>
                                </div>
                                
                                <button
                                    className="btn-add-kid"
                                    onClick={addKid}
                                    disabled={!newKidName.trim() || kids.length >= MAX_KIDS}
                                >
                                    Kind hinzufügen
                                </button>
                            </div>
                        </div>
                    )}

                    {showBackupModal && (
                        <div className="modal-overlay" onClick={() => { setShowBackupModal(false); setImportPreview(null); setBackupError(''); }}>
                            <div className="modal" onClick={(e) => e.stopPropagation()}>
                                <div className="modal-header">
                                    <div className="modal-title">💾 Backup</div>
                                    <button className="modal-close" onClick={() => { setShowBackupModal(false); setImportPreview(null); setBackupError(''); }}>✕</button>
                                </div>

                                <div className="form-group">
                                    <label>Backup exportieren</label>
                                    <button className="btn-add-kid" onClick={exportBackup}>
                                        Als Datei herunterladen
                                    </button>
                                </div>

                                <div className="form-group">
                                    <label>Backup importieren</label>
                                    <input
                                        type="file"
                                        accept=".json"
                                        onChange={handleImportFile}
                                    />
                                </div>

                                {backupError && (
                                    <p style={{ color: '#8b4545', fontSize: '13px' }}>{backupError}</p>
                                )}

                                {importPreview && (
                                    <div style={{ background: '#f9f7f4', border: '2px solid #d4af37', borderRadius: '8px', padding: '12px', marginBottom: '15px' }}>
                                        <p style={{ fontSize: '13px', color: '#8b4545', fontWeight: 'bold', marginBottom: '8px' }}>
                                            Achtung: Dies überschreibt alle aktuellen Daten (Kinder, Punkte, Ziele, Rewards)!
                                        </p>
                                        <p style={{ fontSize: '12px', color: '#5a5a5a', marginBottom: '10px' }}>
                                            Backup vom {importPreview.exportedAt ? new Date(importPreview.exportedAt).toLocaleString('de-DE') : 'unbekannt'}, {(importPreview.kids || []).length} Kind(er)
                                        </p>
                                        <button className="btn-add-kid" onClick={confirmImport} style={{ background: '#8b4545' }}>
                                            Wirklich überschreiben
                                        </button>
                                    </div>
                                )}
                            </div>
                        </div>
                    )}
                </div>
            );
        }
        
        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
